# Shared CLI / Panel defaults; seconds preserve fractions. See docs/PROJECT.md.
runner:
  poll_seconds: 5
  cap_seconds: 7200
observer:
  blocked_escalation_seconds: 600
  l0_nudge_grace_seconds: 120
  idle_audit_cooldown_seconds: 120
  audit_cooldown_seconds: 60
  turn_diff_counts_as_progress: true
thresholds:
  repeated_error:
    window_seconds: 600
    count: 3
    cooldown_seconds: 600
  no_progress:
    window_seconds: 300
    min_activity_events: 8
    max_progress_events: 0
    cooldown_seconds: 300
    progress_mode: weak
ao:
  base_url: http://127.0.0.1:3001
  request_timeout_seconds: 15
worker:
  model: gpt-5.6-sol
  spawn_max_attempts: 3
  spawn_backoff_seconds: 30
  spawn_timeout_seconds: 120
  send_timeout_seconds: 60
  kill_timeout_seconds: 30
gate:
  timeout_seconds: 300
  output_limit_chars: 20000
budgets:
  max_subtasks: 1
  max_total_replans: 2
  max_runtime_seconds: 3600
  subtask_budgets:
    max_local_fixes: 2
    max_replans: 1
    max_same_alerts: 2
    max_runtime_seconds: 1800
bus:
  max_hops_per_thread: 24
  max_audits_per_thread: 3
  overall_timeout_seconds: 600
roles:
  planner:
    model: gpt-5.6-sol
    timeout_seconds: 180
  auditor:
    model: gpt-5.6-sol
    timeout_seconds: 180
  verifier:
    model: gpt-5.6-sol
    timeout_seconds: 180
fingerprint:
  strip_ansi: true
  normalize_timestamps: true
  normalize_ids: true
  normalize_paths: true
  normalize_line_numbers: true
  collapse_whitespace: true
  max_length: 200
